      : `<p class="small">Not signed in. The "my plan" models need this; the sign-in takes a minute.</p>
         <div id="planSignin"><button class="btn" type="button" id="planStart">Sign in with your Claude plan</button></div>`}
    <p class="small" id="ccLine">${cc.installed ? `Claude Code ${esc(cc.version.replace(/\s*\(Claude Code\)\s*$/, ""))} is installed. It doesn't update itself.`
      : "Claude Code is not installed in the machine yet."}
      <button class="btn" type="button" id="ccUpdate">${cc.installed ? "Update Claude Code" : "Install Claude Code"}</button></p>
    <h3>Claude apps on your PC</h3>
    <p class="small">Let Claude Code or Claude Desktop on your PC hand tasks to the agent here, as a tool. Their tasks run with the same rules and walls; anything that needs approval still waits for you here, and they can't approve anything.</p>
    <label class="told-switch"><input type="checkbox" id="mcpOn" ${set.mcp_enabled ? "checked" : ""}> Allow Claude apps on my PC to use UVMC</label>
    <p class="small" id="mcpSeen"></p>
    <h3>Models</h3>
    <p class="small">Pick which one a conversation uses in the header. Changes here are kept in the VM on top of config.toml.</p>
    <ul class="alist profiles" id="profiles"></ul>
    <button class="btn" type="button" id="addProfile">Add a model</button>
    <div id="profileForm"></div>
    <h3>API keys</h3>
    <p class="small">Stored in the VM where the agent can't read them. A key is never shown again, only its last characters. <strong>claude-subscription</strong> is your Claude plan's login, set by the sign-in above.</p>
    <ul class="alist keys" id="keys"></ul>
    <h3>What the agent is told</h3>
    <p class="small">At the start of each conversation, in three separate parts. Changes apply from your next new conversation.</p>
    <div id="briefingBox"><p class="small">Loading...</p></div>
    <h3>Allowed sites</h3>
    <p class="small">The agent can reach these and their subdomains. ${net.ask_unknown ? "For any other site, you're asked." : "Other sites are refused without asking."}</p>
    <form class="addsite" id="addSite"><input id="siteInput" placeholder="example.com" aria-label="Site to allow" autocomplete="off"><button class="btn" type="submit">Allow</button></form>
    <ul class="alist sites" id="learnedSites"></ul>
    <p class="small">Set in config.toml: ${net.sites.configured.map(esc).join(", ") || "none"}.</p>
    <details id="tomlBox"><summary>Copy panel settings into config.toml</summary><p class="small">To keep these models in the repo, paste this into supervisor/config.toml on your PC.</p><pre class="cfg" id="tomlText"></pre><button class="btn" type="button" id="copyToml">Copy</button></details>
    <details><summary>config.toml and house rules in the VM</summary>
      <p class="small">Model ${esc(st.model_label)}, agent user ${esc(st.user)}, works in ${esc(st.workdir)}. Edit these in the repo's supervisor folder, then run <strong>update</strong>.</p>
      <pre class="cfg">${esc(c.config)}</pre><pre class="cfg">${esc(c.house_rules)}</pre></details>
    <p class="small about">UVMC ${esc(st.version)} is free software under the GNU AGPL-3.0.
      ${/^https?:\/\//.test(st.source || "") ? `<a href="${esc(st.source)}" target="_blank" rel="noopener">Source code</a>` : "The source code and license are in the UVMC repository."}</p>`;

  $("planStart").addEventListener("click", planSignin);
  $("mcpOn").addEventListener("change", (e) => settingsPost("/api/settings/mcp", { enabled: e.target.checked }, pane));
  api("/api/settings/mcp").then((m) => {
    const line = $("mcpSeen");
    if (!line) return;
    const when = (t) => new Date(t * 1000).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
    line.textContent = m.seen.length
      ? "Connected from your PC: " + m.seen.map((a) => `${a.name} (last ${when(a.at)}${a.allowed ? "" : ", refused: the switch was off"})`).join("; ") + "."
      : "No Claude app on your PC has connected yet. If you ran connect-claude-apps (the installer offers it), open a new Claude Code session or quit and reopen Claude Desktop: they connect when they start. Otherwise run connect-claude-apps from the UVMC folder on your PC once.";
  }).catch(() => {});
  api("/api/briefing").then(renderBriefing).catch((e) => { $("briefingBox").innerHTML = `<p class="small bad">${esc(e.message)}</p>`; });
  $("ccUpdate").addEventListener("click", async (e) => {
    const line = $("ccLine");
    e.target.disabled = true;
    line.firstChild.textContent = "Updating Claude Code; this takes about a minute... ";
    try {
      const r = await api("/api/claude/update", {});
      await loadSettings();
      $("ccLine").insertAdjacentHTML("beforebegin", `<p class="small">${esc(r.message)}</p>`);
    } catch (err) {
      line.firstChild.textContent = err.message + " ";
      line.classList.add("bad");
      e.target.disabled = false;
    }
  });
  const list = $("profiles");
  for (const p of set.profiles) {
    const li = el("li", "profile", `<div><strong>${esc(p.label)}</strong>${p.name === set.default ? ` <span class="tag">default</span>` : ""}
      <div class="sub"><span class="cmdish">${esc(p.model)}</span>, ${PROVIDER_TEXT[p.provider] || esc(p.base_url)}</div>
      <div class="sub">${keyText(p)}${p.source !== "config.toml" ? `, ${esc(p.source)}` : ""}</div></div>`);
    const acts = el("div", "acts2");
    const edit = el("button", "btn", "Edit"); edit.type = "button";
    edit.addEventListener("click", () => profileForm(p));
    acts.appendChild(edit);
    if (p.name !== set.default) {
      const def = el("button", "btn", "Make default"); def.type = "button";
      def.addEventListener("click", () => settingsPost("/api/settings/default", { name: p.name }, pane));
      acts.appendChild(def);
    }
    if (p.source !== "config.toml") {
      const rm = el("button", "btn", p.source === "panel" ? "Remove" : "Reset"); rm.type = "button";
      rm.addEventListener("click", () => settingsPost("/api/settings/profile/remove", { name: p.name }, pane));
      acts.appendChild(rm);
    }
    li.appendChild(acts);
    list.appendChild(li);
  }
  $("addProfile").addEventListener("click", () => profileForm(null));

  const keys = $("keys");
  for (const k of set.keys) {
    const li = el("li", "keyrow", `<div><strong>${esc(k.name)}</strong> <span class="sub">${k.set ? esc(k.hint) : "not set"}${k.used_by.length ? `, for ${k.used_by.map(esc).join(", ")}` : ""}</span></div>`);
    const f = el("form", "addsite");
    const plan = k.name === "claude-subscription";   // set only by the sign-in above, never pasted here
    f.innerHTML = plan ? `<span class="sub">Set by "Sign in with your Claude plan" above.</span>`
      : `<input type="password" autocomplete="off" placeholder="${k.set ? "Paste a new key to replace it" : "Paste the key"}" aria-label="API key ${esc(k.name)}"><button class="btn" type="submit">Save</button>`;
    f.addEventListener("submit", (e) => { e.preventDefault(); const v = f.querySelector("input")?.value.trim(); if (v) settingsPost("/api/settings/key", { name: k.name, key: v }, pane); });
    if (k.set) {
      const rm = el("button", "btn", plan ? "Sign out" : "Remove"); rm.type = "button";
      rm.addEventListener("click", () => {
        if (!confirm(plan ? "Sign UVMC out of your Claude plan? The \"my plan\" models stop working until you sign in again." : `Remove the key ${k.name}?`)) return;
        settingsPost("/api/settings/key", { name: k.name, key: "" }, pane);
      });
      f.appendChild(rm);
    }
    li.appendChild(f);
    keys.appendChild(li);
  }

  const ul = $("learnedSites");
  if (!net.sites.learned.length) ul.appendChild(el("li", "sub", "None added from the panel yet."));
  for (const h of net.sites.learned) {
    const li = el("li", "", `<span>${esc(h)}</span>`);
    const b = el("button", "btn", "Remove"); b.type = "button";
    b.addEventListener("click", async () => { try { await api("/api/sites/remove", { host: h }); } catch (e) {} loadSettings(); });
    li.appendChild(b); ul.appendChild(li);
  }
  $("addSite").addEventListener("submit", async (e) => {
    e.preventDefault();
    const host = $("siteInput").value.trim();
    if (!host) return;
    try { await api("/api/sites", { host }); loadSettings(); }
    catch (err) { $("siteInput").setCustomValidity(err.message); $("siteInput").reportValidity(); setTimeout(() => $("siteInput").setCustomValidity(""), 3000); }
  });
  $("tomlBox").addEventListener("toggle", async () => {
    const t = (await api("/api/settings/toml")).toml;
    $("tomlText").textContent = t || "Nothing changed in the panel yet.";
  });
  $("copyToml").addEventListener("click", () => navigator.clipboard?.writeText($("tomlText").textContent));
}

// What the agent is told: 1. house rules, 2. the live briefing, 3. your notes. Kept apart on
// purpose: the house rules are the fixed rules; the briefing and notes are about right now and you.
function renderBriefing(d) {
  const box = $("briefingBox");
  if (!box) return;
  const parts = Object.entries(d.labels).map(([k, label]) =>
    `<label><input type="checkbox" data-part="${esc(k)}" ${d.parts[k] ? "checked" : ""} ${d.enabled ? "" : "disabled"}> ${esc(label)}</label>`).join("");
  box.innerHTML = `<div class="told">
    <section class="rules"><h4>1. House rules</h4>
      <p class="small">The fixed rules for the agent, ${d.house_rules_source === "panel" ? "<strong>changed in the panel</strong> (the repo's version is kept)" : "from the repo (<span class=\"cmdish\">supervisor/house_rules.md</span>)"}. Workers get them too; a coordinator gets its own role's rules instead.</p>
      <details><summary>Show and edit</summary>
        <form class="pform" id="rulesForm"><textarea class="mono" name="text" rows="18" spellcheck="false">${esc(d.house_rules)}</textarea>
          <p class="small form-msg"></p>
          <div class="actions"><button class="btn primary" type="submit">Save house rules</button>
          ${d.house_rules_source === "panel" ? `<button class="btn" type="button" id="rulesReset">Reset to the repo version</button>` : ""}</div></form>
      </details></section>
    <form class="pform told-form" id="briefForm" style="border:0;padding:0;margin:0;gap:12px">
      <section class="live"><h4>2. Live briefing</h4>
        <p class="small">Written by the supervisor when a conversation starts, so the agent knows its situation. Workers get one too, written for their role.</p>
        <label class="told-switch"><input type="checkbox" name="enabled" ${d.enabled ? "checked" : ""}> Give the agent a live briefing</label>
        <div class="checks">${parts}</div></section>
      <section class="notes"><h4>3. Your notes</h4>
        <p class="small">Anything you want every conversation to know, e.g. "Answer in French" or "My projects use Python 3.12".</p>
        <textarea name="notes" rows="4" maxlength="${d.notes_max}" placeholder="Nothing yet">${esc(d.notes || "")}</textarea></section>
      <p class="small form-msg"></p>
      <div class="actions"><button class="btn primary" type="submit">Save briefing and notes</button></div>
    </form>
    <details><summary>Preview: the full text the agent you talk to gets</summary><pre class="cfg">${esc(d.preview)}</pre></details>
  </div>`;
  const bf = $("briefForm");
  bf.enabled.addEventListener("change", () => bf.querySelectorAll("[data-part]").forEach((c) => { c.disabled = !bf.enabled.checked; }));
  const done = (form, text) => { const m = form.querySelector(".form-msg"); m.classList.remove("bad"); m.textContent = text; };
  const failed = (form, err) => { const m = form.querySelector(".form-msg"); m.classList.add("bad"); m.textContent = err.message; };
  bf.addEventListener("submit", async (e) => {
    e.preventDefault();
    const parts = {};
    bf.querySelectorAll("[data-part]").forEach((c) => { parts[c.dataset.part] = c.checked; });
    try {
      renderBriefing(await api("/api/briefing", { enabled: bf.enabled.checked, parts, notes: bf.notes.value }));
      done($("briefForm"), "Saved. It applies from your next new conversation.");
    } catch (err) { failed(bf, err); }
  });
  const rf = $("rulesForm");
  rf.addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      renderBriefing(await api("/api/house-rules", { text: rf.text.value }));
      $("rulesForm").closest("details").open = true;
      done($("rulesForm"), "Saved. They apply from your next new conversation.");
    } catch (err) { failed(rf, err); }
  });
  $("rulesReset")?.addEventListener("click", async () => {
    try {
      renderBriefing(await api("/api/house-rules/reset", {}));
      $("rulesForm").closest("details").open = true;
      done($("rulesForm"), "Back to the repo version, from your next new conversation.");
    } catch (err) { failed(rf, err); }
  });
}

// Sign in with your Claude plan: the supervisor runs Claude Code's own setup-token, the
// panel shows its link, you paste back the code the page gives you. The token is never shown.
async function planSignin() {
  const box = $("planSignin");
  const retry = (text) => {
    box.innerHTML = `<p class="small bad">${esc(text)}</p><button class="btn" type="button" id="planStart">Start the sign-in again</button>`;
    $("planStart").addEventListener("click", planSignin);
  };
  box.innerHTML = `<p class="small">Starting the sign-in...</p>`;
  let url;
  try { url = (await api("/api/signin/start", {})).url; } catch (e) { retry(e.message); return; }
  box.innerHTML = `<form class="pform" id="planForm">
    <label>1. Open the sign-in page, sign in with your Claude account and approve.
      <a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open the sign-in page</a></label>
    <label>2. The page then shows a code. Paste it here:
      <input name="code" autocomplete="off" spellcheck="false" required placeholder="the code from the sign-in page"></label>
    <p class="small form-msg"></p>
    <div class="actions"><button class="btn primary" type="submit">Finish signing in</button><button class="btn" type="button" data-cancel>Cancel</button></div>
  </form>`;
  const f = $("planForm");
  f.querySelector("[data-cancel]").addEventListener("click", async () => {
    await api("/api/signin/cancel", {}).catch(() => {});
    loadSettings();
  });
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = f.querySelector(".form-msg");
    msg.classList.remove("bad");
    msg.textContent = "Finishing the sign-in, then checking the token with one small request to Claude. This can take a few minutes; it stops with a timeout message after about 4.";
    f.querySelector("button[type=submit]").disabled = true;
    try {
      await api("/api/signin/code", { code: f.code.value });
      showModels(await api(stateUrl()));
      await loadSettings();   // now shows "Signed in" with a tick
    } catch (err) {
      retry(err.message);
    }
  });
  f.code.focus();
}

function profileForm(p) {
  const box = $("profileForm");
  const isNew = !p;
  p = p || { name: "", label: "", provider: "openai", model: "", base_url: "", key: "", max_tokens_param: "max_tokens" };
  box.innerHTML = `<form class="pform">
    <h3>${isNew ? "Add a model" : `Edit ${esc(p.label)}`}</h3>
    ${isNew ? `<label>Start from <select name="preset">${Object.entries(PRESETS).map(([k, v]) => `<option value="${k}">${k ? esc(v.label) : "Nothing"}</option>`).join("")}</select></label>` : ""}
    <label>Name (short, for the picker's id) <input name="name" value="${esc(p.name)}" ${isNew ? "" : "readonly"} required pattern="[a-z0-9][a-z0-9_-]{0,40}" placeholder="my-model"></label>
    <label>Label <input name="label" value="${esc(p.label)}" placeholder="My model"></label>
    <label>Kind of API <select name="provider"><option value="anthropic">Anthropic</option><option value="openai">OpenAI-compatible</option><option value="claude-code">Claude Code on my plan</option></select></label>
    <label>Address (base URL) <input name="base_url" value="${esc(p.base_url)}" placeholder="https://..."></label>
    <label>Model name <input name="model" value="${esc(p.model)}" required placeholder="as the provider names it"></label>
    <label>Key name <input name="key" value="${esc(p.key)}" placeholder="empty if no key is needed"></label>
    <details><summary>Advanced</summary><label>Length setting the API expects <input name="max_tokens_param" value="${esc(p.max_tokens_param)}"></label></details>
    <p class="small form-msg"></p>
    <div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-cancel>Cancel</button></div></form>`;
  const f = box.querySelector("form");
  f.provider.value = p.provider;
  f.querySelector("[data-cancel]").addEventListener("click", () => { box.innerHTML = ""; });
  f.preset?.addEventListener("change", () => {
    const v = PRESETS[f.preset.value]; if (!v) return;
    f.provider.value = v.provider || "openai"; f.label.value = v.label; f.base_url.value = v.base_url;
    if (v.model) f.model.value = v.model;
    f.key.value = v.key ?? ""; f.max_tokens_param.value = v.max_tokens_param || "max_tokens";
    if (!f.name.value) f.name.value = f.preset.value;
  });
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const body = Object.fromEntries(["name", "label", "provider", "base_url", "model", "key", "max_tokens_param"].map((k) => [k, f[k].value]));
    settingsPost("/api/settings/profile", body, box);
  });
  f.scrollIntoView({ block: "nearest" });
  (isNew ? f.preset : f.model).focus();
}

// --- Activity tab ----------------------------------------------------------------
let activityMode = "programs", activityAvailable = true, networkOn = true;
const activityVisible = () => !$("pane-activity").hidden;
function renderActivity() {
  const pane = $("pane-activity");
  const seg = `<div class="seg" role="group" aria-label="Show"><button type="button" data-m="programs" aria-pressed="${activityMode === "programs"}">Programs</button><button type="button" data-m="sites" aria-pressed="${activityMode === "sites"}">Sites</button></div>`;
  let body;
  if (activityMode === "programs") {
    const rows = activity.execs.slice(-300).reverse();
    body = !activityAvailable ? `<p class="small">The activity log isn't running. It needs the VM's audit service; run <strong>update</strong> on your PC.</p>`
      : rows.length ? `<ul class="alist">${rows.map((e) => `<li><div class="cmd">${esc(cmdline(e))}</div><div class="sub">${esc(new Date((e.at || e.t) * 1000).toLocaleTimeString())}${e.cwd ? `, in ${esc(e.cwd)}` : ""}</div></li>`).join("")}</ul>`
      : `<p class="small">Every program the agent starts appears here, including ones started inside scripts.</p>`;
  } else {
    const rows = activity.nets.slice(-300).reverse();
    body = !networkOn ? `<p class="small">The network proxy isn't running, so the agent has no internet at all.</p>`
      : rows.length ? `<ul class="alist">${rows.map((e) => `<li><div>${e.verdict === "allow" ? "" : `<span class="denied">Refused</span> `}<strong>${esc(e.host)}</strong>:${e.port}${e.who === "claude-code" ? " (Claude Code itself)" : ""}</div><div class="sub">${esc(new Date(e.t * 1000).toLocaleTimeString())}, ${e.verdict === "allow" ? `${fmtBytes(e.sent)} out, ${fmtBytes(e.received)} in` : esc(e.reason)}</div></li>`).join("")}</ul>`
      : `<p class="small">Every site the agent contacts appears here. It has no other way online.</p>`;
  }
  pane.innerHTML = `<h2>Activity in this conversation</h2>${seg}${body}`;
  pane.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => { activityMode = b.dataset.m; renderActivity(); }));
}
async function loadActivity() {
  try { const s = await api("/api/state"); activityAvailable = s.activity; networkOn = s.network; } catch (e) {}
  renderActivity();
}

// --- Tabs --------------------------------------------------------------------
const loaders = { files: () => loadFiles(filePath), tools: () => loadTools(), activity: loadActivity, runs: () => loadRuns(), machine: loadMachine, settings: loadSettings };
const tabs = [...document.querySelectorAll('.tabs [role="tab"]')];
function selectTab(tab) {
  for (const t of tabs) {
    const on = t === tab;
    t.setAttribute("aria-selected", String(on));
    t.tabIndex = on ? 0 : -1;
    $(t.getAttribute("aria-controls")).hidden = !on;
  }
  const name = tab.id.replace("tab-", "");
  loaders[name]();
  clearInterval(machineTimer);
  if (name === "machine") machineTimer = setInterval(loadMachine, 5000);
}
tabs.forEach((t, i) => {
  t.addEventListener("click", () => selectTab(t));
  t.addEventListener("keydown", (e) => {
    const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
    if (d) { const next = tabs[(i + d + tabs.length) % tabs.length]; next.focus(); selectTab(next); }
  });
});

// --- Start -------------------------------------------------------------------
showEmpty();
connect();
selectTab(tabs[0]);
</script>
